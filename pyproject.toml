[project]
dynamic = ["version"]
name = "netreaper"
description = "Offensive Security Framework with Modern TUI"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
keywords = ["security", "pentesting", "wireless", "hacking", "tui"]
authors = [
    { name = "NETREAPER Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    # Upper bound and a realistic floor. The declared floor was >=0.47.0 while
    # the app is written and tested against 8.x: the command-palette Provider,
    # push_screen_wait and the settable `theme` attribute are not all present in
    # 0.47, so an install that honoured the old floor could not have run the TUI.
    "textual>=8.0,<9",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "aiosqlite>=0.19.0",
    "pyee>=11.0.0",
    "transitions>=0.9.0",
    "typer>=0.9.0",
    # >=41.0.0 with no ceiling resolved to 50.0.1 here: nine major versions
    # past the declared floor, on the one dependency that is actually
    # security-critical. Capped like mypy below, for the same reason.
    "cryptography>=41.0.0,<51",
    "keyring>=24.3.0",
    "tomli-w>=1.0.0",
    # nmap XML results are re-read from disk by a different call than the one
    # that wrote them, so they are parsed as untrusted input. Was arriving
    # transitively; declared, because a defence is not a defence if a resolver
    # can drop it.
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",  # a hung test must name itself, not burn the CI job limit
    "hypothesis>=6.92.0",
    "textual-dev>=1.2.0",
    "ruff>=0.1.9",
    "mypy>=2.3,<3",  # pinned <3: the safety-spine mypy gate is blocking (CI), keep it stable
    "pre-commit>=3.6.0",
]
distributed = [
    "redis>=5.0.0",
    "celery>=5.3.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
netreaper = "netreaper.cli:app"

[project.entry-points."netreaper.tools"]
# Built-in tool adapters (only those that exist; more land as tools are migrated)
nmap = "netreaper.tools.nmap:NmapTool"
masscan = "netreaper.tools.masscan:MasscanTool"
john = "netreaper.tools.john:JohnTool"
hydra = "netreaper.tools.hydra:HydraTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/netreaper"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific
]
ignore = [
    "B008",   # typer/fastapi idiom: Option()/Argument() in defaults is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "E402"]  # tests: allow assert, long lines, local imports

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scapy.*", "netifaces.*", "pyee.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=netreaper --cov-report=term-missing"

[tool.coverage.run]
source = ["src/netreaper"]
branch = true
