name: Release

# Tag-triggered signed-release pipeline (Rebuild Master Plan, Phase 5).
# Push a SemVer tag to cut a release:
#   git tag v10.2.4          -> stable release
#   git tag v10.3.0-rc.1     -> pre-release (rc channel)
#   git tag v10.3.0-beta.2   -> pre-release (beta channel)
#   git tag v10.3.0-alpha.1  -> pre-release (alpha channel)
#   git tag v10.3.0-nightly  -> pre-release (nightly channel)
# The tag version must match the VERSION file (single source of truth).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write   # create the GitHub release and upload assets
  id-token: write   # Sigstore keyless (OIDC) signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Derive version and channel from the tag
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"; channel="${channel%%.*}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $tag (channel=${channel:-stable})"

      - name: Verify the tag matches the VERSION file
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${{ steps.meta.outputs.version }}"
          if [[ "$tag_version" != "$file_version" ]]; then
            echo "::error::tag version '$tag_version' does not match VERSION file '$file_version'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the licence travels in the artifacts
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl | grep -Eq '(^|/)LICENSE' || { echo "::error::wheel is missing LICENSE"; exit 1; }
          tar -tzf dist/*.tar.gz | grep -Eq '(^|/)LICENSE' || { echo "::error::sdist is missing LICENSE"; exit 1; }

      - name: Verify the built artifacts install and import
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          python -c "import netreaper; print('netreaper', netreaper.__version__)"
          netreaper --version

      - name: SBOM (CycloneDX) for the release
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/netreaper-${{ steps.meta.outputs.version }}.sbom.cyclonedx.json
          upload-artifact: false        # attached to the release via gh below
          upload-release-assets: false  # no-op on a push event; avoid a dup path

      - name: Per-artifact SHA256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # SBOM is hashed too (it is generated before this step), so signing
          # SHA256SUMS transitively authenticates every published artifact.
          sha256sum ./*.whl ./*.tar.gz ./*.sbom.cyclonedx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Sign artifacts (Sigstore keyless)
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/*.sbom.cyclonedx.json
            ./dist/SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          assets=(
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sigstore.json
            dist/*.sbom.cyclonedx.json
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            # Idempotent: a retry after a mid-pipeline failure re-uploads assets.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            pre_flag=""
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              pre_flag="--prerelease"
            fi
            gh release create "$tag" \
              --title "NETREAPER $tag" \
              --generate-notes \
              $pre_flag \
              "${assets[@]}"
          fi
