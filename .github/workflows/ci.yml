name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # A hung test used to run to the six-hour job ceiling and report as
    # "cancelled", which reads like an infrastructure blip rather than a
    # defect. Two PRs sat blocked for two days on exactly that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Tests (import smoke + safety-gate contract + exporters)
        # --timeout makes a hang fail as a named test with a stack, instead of
        # a killed job with no output to read.
        run: python -m pytest tests/ -q --timeout=120
      - name: Lint (advisory during the migration)
        run: ruff check src tests || true
      - name: Type-check the safety spine (blocking)
        # These files are the security chokepoint (scope gate, spawn seam,
        # engagement/consent, audit chain). They are type-clean and must stay so;
        # the rest of the tree remains advisory during the migration (see below).
        run: >-
          mypy
          src/netreaper/core/process.py
          src/netreaper/safety/scope.py
          src/netreaper/safety/protected.py
          src/netreaper/core/exceptions.py
          src/netreaper/core/audit.py
          src/netreaper/safety/validators.py
      - name: Type-check the rest of the tree (advisory during the migration)
        run: mypy src tests || true
      - name: SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: netreaper-sbom.cyclonedx.json

  bash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax (blocking)
        run: |
          for f in $(git ls-files '*.sh') bin/netreaper-install; do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: ShellCheck (advisory)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error bin/netreaper-install $(git ls-files '*.sh') || true
