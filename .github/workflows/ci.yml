name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Tests (import smoke + safety-gate contract + exporters)
        run: python -m pytest tests/ -q
      - name: Lint (advisory during the migration)
        run: ruff check src tests || true
      - name: Type-check the safety spine (advisory during the migration)
        run: mypy src/netreaper/core/process.py src/netreaper/safety/scope.py src/netreaper/safety/protected.py src/netreaper/core/exceptions.py || true

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bash syntax (blocking)
        run: |
          for f in $(git ls-files '*.sh') bin/netreaper-install; do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: ShellCheck (advisory)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error bin/netreaper-install $(git ls-files '*.sh') || true
